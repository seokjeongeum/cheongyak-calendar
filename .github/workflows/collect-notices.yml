name: Collect official notices

on:
  # UTC; approximately every three hours at :17 in Korea as well.
  # GitHub schedules only workflows present on the default branch.
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Collect feeds or reprocess saved official documents
        type: choice
        options: [collect, reprocess]
        default: collect
      notice_ids:
        description: Comma-separated saved notice UUIDs for reprocessing; empty selects up to 50 active notices
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: cheongyak-official-ingestion
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Verify database connection is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Add the DATABASE_URL repository Actions secret before collecting."
            exit 1
          fi

      - name: Check out the deployed application branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install public document converter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Install collector
        run: python -m pip install ./api

      - name: Collect official notices once
        if: github.event.inputs.operation != 'reprocess'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Service keys are read from this database, never Actions variables.
          LOG_LEVEL: WARNING
        run: python -m app.ingest.worker --once

      - name: Reprocess saved official documents
        if: github.event.inputs.operation == 'reprocess'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOTICE_IDS: ${{ inputs.notice_ids }}
          LOG_LEVEL: WARNING
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import uuid

          ids = [value.strip() for value in os.environ.get("NOTICE_IDS", "").split(",") if value.strip()]
          if len(ids) > 50:
              raise SystemExit("At most 50 saved notices can be selected.")
          args = [sys.executable, "-m", "app.extract.reprocess", "--limit", "50", "--report", "/tmp/document-review.json"]
          if ids:
              for value in dict.fromkeys(ids):
                  args.extend(["--notice-id", str(uuid.UUID(value))])
          else:
              args.append("--active")
          subprocess.run(args, check=True)
          PY

      - name: Save public document review report
        if: always() && github.event.inputs.operation == 'reprocess'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-document-review
          path: /tmp/document-review.json
          if-no-files-found: ignore
          retention-days: 7
