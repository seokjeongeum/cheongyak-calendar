name: Copy existing application database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cheongyak-official-ingestion
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify source and target secrets are configured
        env:
          SOURCE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TARGET_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$SOURCE_DATABASE_URL" ] || [ -z "$TARGET_DATABASE_URL" ]; then
            echo "Configure the existing DATABASE_URL and new SUPABASE_DATABASE_URL Actions secrets before copying."
            exit 1
          fi

      - name: Check out the application branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install application database copy command
        run: python -m pip install ./api

      - name: Copy a read-only snapshot and verify all table counts
        env:
          SOURCE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TARGET_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          LOG_LEVEL: WARNING
        run: python -m app.migrate_database
